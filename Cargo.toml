[package]
name = "ossido-site"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "ossido"
path = ".ossido/main.rs"

[dependencies]
ossido = { version = "0.1.4" }
serde = { version = "1.0.202", features = ["derive"] }
tower-http = { version = "0.6.8", features = ["full"] }
# Build-time fetch of benchmark results in the /benchmarks handler. Ossido already
# depends on reqwest 0.13 (native-tls), so these features unify - no extra build.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
