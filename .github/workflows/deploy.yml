name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manually re-running the deploy from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions the Pages deploy needs: read the repo, publish the
# artifact, and mint the OIDC token actions/deploy-pages exchanges with Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-flight one so a running
# publish always finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on formatting, lint, and types. Each runs as its own matrix
  # leg so all three report independently (fail-fast off) and in parallel. These
  # need only Bun - no Rust toolchain or ossido CLI - so they stay fast.
  checks:
    name: check (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format:check, lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry + ./target across runs. The ossido server build
      # pulls ossido_ssr, which compiles V8 (rusty_v8) — slow without this.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `ossido build` is the framework CLI (Rust). It's published as ossido_cli;
      # install it so `bun run build` can shell out to `ossido`.
      - name: Install ossido CLI
        run: cargo install ossido_cli --version 0.1.1 --locked

      # `ossido build` runs the prebuild hooks (bake the cube mesh + search
      # index), cargo-builds the SSR server to pre-render, and emits the static
      # site to ./out/static (output: 'static').
      - name: Build
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
